[package]
name = "keytool"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Windows-only CLI to initialize and exercise named AziHSM TLS keys"
repository = "https://github.com/cwshugg/azihsm-tls"

[dependencies]
azihsm-ncrypt = { path = "../azihsm-ncrypt" }
clap = { version = "=4.6.7", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "fmt",
    "std",
] }
