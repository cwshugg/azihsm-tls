[package]
name = "azihsm-ca-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Windows-only AziHSM TLS certificate enrollment demonstration"
repository = "https://github.com/cwshugg/azihsm-tls"

[dependencies]
azihsm-ca-client = { path = "../azihsm-ca-client" }
clap = { version = "=4.6.7", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
