[package]
name = "azihsm-ca-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Windows-only AziHSM TLS certificate enrollment demonstration"
repository = "https://github.com/cwshugg/azihsm-tls"

[dependencies]
azihsm-ca-client = { path = "../azihsm-ca-client" }
azihsm-ncrypt = { path = "../azihsm-ncrypt" }
clap = { version = "=4.6.7", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
pem = "=3.0.6"
time = { version = "=0.3.55", default-features = false, features = ["std", "formatting", "parsing"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
